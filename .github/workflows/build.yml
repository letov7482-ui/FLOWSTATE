name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Fabric 1.21.11, Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Read mod version
        run: |
          echo "ARTIFACT_VERSION=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')" >> "$GITHUB_ENV"

      - name: Resolve & pin Fabric versions (strict 1.21.11)
        run: |
          set -euo pipefail
          REQUIRED_MC="1.21.11"
          UA="flowstate-ci (+https://github.com)"

          # Читаем значение, зачищая случайные встроенные комментарии
          read_prop() {
            grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'
          }

          MC="$(read_prop minecraft_version)"
          echo "gradle.properties: minecraft_version='$MC'"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets Minecraft $REQUIRED_MC strictly, but gradle.properties has '$MC'."
            exit 1
          fi
          echo "MC=$MC" >> "$GITHUB_ENV"

          YARN_JSON="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/yarn)"
          YARN="$(printf '%s' "$YARN_JSON" | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
          if [ -z "$YARN" ]; then
            echo "::error::No Yarn mappings for $MC on Fabric meta."
            exit 1
          fi

          LOADER_JSON="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/loader)"
          LOADER="$(printf '%s' "$LOADER_JSON" | jq -r '[.[] | select(.stable == true)][0].version')"
          if [ -z "$LOADER" ]; then
            echo "::error::No stable Fabric Loader version on meta."
            exit 1
          fi

          # Fabric API: источник 1 - Modrinth, источник 2 - maven.fabricmc.net
          FAPI="$(curl -fsSL -A "$UA" \
            "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D" \
            | jq -r '.[0].version_number // empty' || true)"
          if [ -z "$FAPI" ]; then
            echo "Modrinth has no Fabric API for $MC, trying maven.fabricmc.net..."
            FAPI="$(curl -fsSL -A "$UA" https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
              | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$FAPI" ]; then
            echo "::error::No Fabric API build for $MC found (checked Modrinth and maven.fabricmc.net)."
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          {
            echo "YARN=$YARN"
            echo "LOADER=$LOADER"
            echo "FAPI=$FAPI"
          } >> "$GITHUB_ENV"
          echo "Pinned: minecraft=$MC | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI"

      - name: Build (compile + unit tests)
        run: gradle --no-daemon build --stacktrace

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
