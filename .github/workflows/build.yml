name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      loom_version:
        description: 'Loom: 1.11.8 (known-good) | latest | точная версия'
        type: string
        default: '1.11.8'
      fabric_api_pick:
        description: 'Fabric API для 1.21.11 (previous = обход сломанного javadoc)'
        type: choice
        options: [ latest, previous ]
        default: previous
      clean_cache:
        description: 'Чистить Gradle-кэш перед сборкой'
        type: boolean
        default: true
      gradle_version:
        description: 'Gradle (менять только если digest явно попросит)'
        type: string
        default: '8.14.2'

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Fabric 1.21.11, Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '${{ inputs.gradle_version || ''8.14.2'' }}'

      # На push тоже чистим: на этапе отладки это убирает лишнюю переменную.
      - name: Clean Gradle caches
        if: ${{ inputs.clean_cache == true || github.event_name == 'push' }}
        run: |
          echo "Wiping ~/.gradle/caches"
          rm -rf ~/.gradle/caches

      - name: Read mod version
        run: |
          V="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')"
          [ -n "$V" ] || V="0.1.0"
          echo "ARTIFACT_VERSION=$V" >> "$GITHUB_ENV"

      # Показываем доступные версии Loom в КАЖДОМ запуске — чтобы выбор был из фактов.
      - name: List available Loom releases
        run: |
          fetch() { curl -fsSL -A flowstate-ci "$1" 2>/dev/null || true; }
          META="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml)"
          if [ -n "$META" ]; then
            echo "Newest stable Loom releases on maven.fabricmc.net:"
            printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' \
              | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 10 | sed 's/^/  /' || true
          else
            echo "::warning::Could not fetch Loom metadata (non-fatal)"
          fi

      - name: Resolve Loom version
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -A flowstate-ci "$1" 2>/dev/null || true; }
          valid() { printf '%s' "$1" | grep -qE '^[0-9]+(\.[0-9]+)+$'; }

          REQ="${{ inputs.loom_version || '1.11.8' }}"
          LOOM=""
          if [ "$REQ" != "latest" ]; then
            LOOM="$REQ"
          else
            META="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml)"
            if [ -n "$META" ]; then
              CAND="$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' \
                | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 1 || true)"
              valid "$CAND" && LOOM="$CAND"
            fi
            if ! valid "$LOOM"; then
              LOOM="1.11.8"
              echo "::warning::Auto-detect failed, falling back to known-good 1.11.8"
            fi
          fi
          if ! valid "$LOOM"; then
            echo "::error::Invalid loom_version input: '$LOOM'"
            exit 1
          fi
          sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '$LOOM'/" build.gradle
          grep -n "fabric-loom" build.gradle
          echo "LOOM=$LOOM" >> "$GITHUB_ENV"
          echo "Using Loom $LOOM"

      - name: Resolve & pin Fabric versions (strict 1.21.11)
        run: |
          set -euo pipefail
          REQUIRED_MC="1.21.11"
          UA="flowstate-ci (+https://github.com)"
          PICK="${{ inputs.fabric_api_pick || 'previous' }}"

          read_prop() {
            grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'
          }

          MC="$(read_prop minecraft_version)"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets $REQUIRED_MC strictly, gradle.properties has '$MC'"
            exit 1
          fi

          YARN="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/yarn \
            | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
          if [ -z "$YARN" ]; then
            echo "::error::No Yarn mappings for $MC."
            exit 1
          fi

          LOADER="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/loader \
            | jq -r '[.[] | select(.stable == true)][0].version')"

          VERSIONS_JSON="$(curl -fsSL -A "$UA" \
            "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D")"
          if [ "$PICK" = "previous" ]; then
            FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[1].version_number // empty')"
            if [ -z "$FAPI" ]; then
              echo "::warning::Only one Fabric API build for $MC exists; using latest"
              FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[0].version_number // empty')"
            fi
          else
            FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[0].version_number // empty')"
          fi
          if [ -z "$FAPI" ]; then
            FAPI="$(curl -fsSL -A "$UA" https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
              | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n1 || true)"
          fi
          if [ -z "$FAPI" ]; then
            echo "::error::No Fabric API build for $MC found."
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          { echo "YARN=$YARN"; echo "LOADER=$LOADER"; echo "FAPI=$FAPI"; } >> "$GITHUB_ENV"
          echo "Pinned: loom=${LOOM} | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI (pick=$PICK)"

      - name: Build (compile + unit tests)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace --console=plain 2>&1 | tee build_log.txt

      # Выжимка падения: на вкладку Summary и в лог шага. Работает всегда, когда упал Build.
      - name: Failure digest
        if: failure() && steps.build.outcome == 'failure'
        run: |
          GRADLE_USED="${{ inputs.gradle_version || '8.14.2' }}"
          if [ ! -f build_log.txt ]; then
            echo "::error::No build log captured"
            exit 0
          fi
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          {
            echo "## 🔎 FLOWSTATE failure digest"
            echo
            echo "loom=${LOOM} | fabric-api=${FAPI} | gradle=${GRADLE_USED}"
            echo
            echo '```text'
            awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt
            echo
            echo "--- Caused by chain ---"
            grep 'Caused by:' build_log.txt | head -n 12
            echo
            echo "--- Key errors ---"
            grep -nE 'error: |cannot find symbol|package .* does not exist|Failed to apply plugin|Minimum supported Gradle|Unsupported class' build_log.txt | head -n 40
            echo '```'
          } >> "$SUMMARY_FILE" 2>/dev/null || true
          # Те же сведения в лог шага (видно и без Summary):
          awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt || true
          grep 'Caused by:' build_log.txt | head -n 5 || true
          # Автоподсказка для самого частого сценария:
          MIN_GRADLE="$(grep -o 'Minimum supported Gradle version is [0-9.]*' build_log.txt | head -n1 | grep -o '[0-9.]*$' || true)"
          if [ -n "$MIN_GRADLE" ]; then
            echo "::notice::Loom требует Gradle >= ${MIN_GRADLE}. Перезапустите workflow с gradle_version=${MIN_GRADLE} и loom_version=latest."
          fi

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
