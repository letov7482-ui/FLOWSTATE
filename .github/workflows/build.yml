name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      loom_strategy:
        description: 'Loom: reference (как в fabric-example-mod) | snapshot (1.11-SNAPSHOT) | newest_release | loom_110'
        type: choice
        options: [ reference, snapshot, newest_release, loom_110 ]
        default: reference

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Fabric 1.21.11, Java 21)
    runs-on: ubuntu-latest
    env:
      LOOM_STRATEGY: ${{ inputs.loom_strategy || 'reference' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Берём версию Gradle из эталонного шаблона Fabric (до setup-gradle).
      - name: Detect reference Gradle version
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -A flowstate-ci "$1" 2>/dev/null || true; }
          BRANCH="$(fetch https://api.github.com/repos/FabricMC/fabric-example-mod | jq -r '.default_branch // empty')"
          [ -n "$BRANCH" ] || BRANCH="main"
          echo "REF_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          GW="$(fetch "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/${BRANCH}/gradle/wrapper/gradle-wrapper.properties")"
          GV="$(printf '%s' "$GW" | grep -oE 'gradle-[0-9]+(\.[0-9]+)+' | head -n1 | sed 's/^gradle-//' || true)"
          echo "REF_GRADLE=$GV" >> "$GITHUB_ENV"
          echo "Reference Gradle: '${GV:-unknown}' (fallback 8.14.2)"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.REF_GRADLE || '8.14.2' }}

      # Отладочный режим: чистый кэш убирает последствия оборванных запусков.
      - name: Clean Gradle caches
        run: |
          echo "Wiping ~/.gradle/caches (debug mode)"
          rm -rf ~/.gradle/caches

      - name: Read mod version
        run: |
          V="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')"
          [ -n "$V" ] || V="0.1.0"
          echo "ARTIFACT_VERSION=$V" >> "$GITHUB_ENV"

      # Единый шаг подготовки. НИ ОДНОГО ${{ }} внутри — только env и вычисления.
      - name: Prepare versions (loom, yarn, loader, fabric-api)
        run: |
          set -euo pipefail
          UA="flowstate-ci (+https://github.com)"
          REQUIRED_MC="1.21.11"
          fetch() { curl -fsSL -A "$UA" "$1" 2>/dev/null || true; }
          valid_loom() { printf '%s' "$1" | grep -qE '^[0-9]+(\.[0-9]+)+(-SNAPSHOT)?$'; }
          read_prop() { grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'; }

          MC="$(read_prop minecraft_version)"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets $REQUIRED_MC strictly, gradle.properties has '$MC'"
            exit 1
          fi

          # ---- Эталон: fabric-example-mod ----
          BRANCH="${REF_BRANCH:-main}"
          BG="$(fetch "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/${BRANCH}/build.gradle")"
          GP="$(fetch "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/${BRANCH}/gradle.properties")"
          LOOM_REF="$(printf '%s' "$BG" | grep -oE "fabric-loom['\"] *version *['\"][^'\"]+" | head -n1 | sed "s/.*version *['\"]//" || true)"
          get_ref() { printf '%s' "$GP" | grep -m1 "^$1=" | cut -d= -f2- | tr -d '[:space:]\r' || true; }
          REF_MC="$(get_ref minecraft_version)"
          REF_YARN="$(get_ref yarn_mappings)"
          REF_LOADER="$(get_ref loader_version)"
          REF_FAPI="$(get_ref fabric_version)"

          # ---- Кандидаты Loom из maven-метаданных ----
          META="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml)"
          LOOM_ALL="$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' || true)"
          LOOM_TOP10="$(printf '%s\n' "$LOOM_ALL" | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 10 || true)"
          LOOM_NEWEST="$(printf '%s\n' "$LOOM_TOP10" | tail -n 1 || true)"
          LOOM_110="$(printf '%s\n' "$LOOM_ALL" | grep -E '^1\.10\.' | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 1 || true)"

          # ---- Выбор Loom. Никогда не exit 1: цепочка заканчивается проверенной 1.11-SNAPSHOT ----
          LOOM=""
          case "$LOOM_STRATEGY" in
            snapshot)       LOOM="1.11-SNAPSHOT" ;;
            newest_release) LOOM="$LOOM_NEWEST" ;;
            loom_110)       LOOM="$LOOM_110" ;;
            *)              LOOM="$LOOM_REF" ;;
          esac
          valid_loom "$LOOM" || LOOM=""
          if [ -z "$LOOM" ]; then
            if [ -n "$LOOM_REF" ] && valid_loom "$LOOM_REF"; then
              LOOM="$LOOM_REF"
            else
              LOOM="1.11-SNAPSHOT"
            fi
            echo "::warning::Strategy '$LOOM_STRATEGY' gave no valid Loom; fallback: $LOOM"
          fi
          sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '$LOOM'/" build.gradle

          # ---- Yarn / Loader / Fabric API ----
          if [ "$REF_MC" = "$REQUIRED_MC" ] && [ -n "$REF_YARN" ] && [ -n "$REF_FAPI" ]; then
            echo "Reference targets $REQUIRED_MC -> adopting its validated combo"
            YARN="$REF_YARN"; LOADER="$REF_LOADER"; FAPI="$REF_FAPI"
          else
            echo "Reference mc='${REF_MC:-?}' != $REQUIRED_MC -> resolving ourselves"
            YARN="$(fetch https://meta.fabricmc.net/v2/versions/yarn | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
            VJ="$(fetch "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D")"
            FAPI="$(printf '%s' "$VJ" | jq -r '.[0].version_number // empty')"
            if [ -z "$FAPI" ]; then
              FAPI="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n1)"
            fi
          fi
          if [ -z "${LOADER:-}" ]; then
            LOADER="$(fetch https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable == true)][0].version')"
          fi
          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$FAPI" ]; then
            echo "::error::Resolution failed: yarn='$YARN' loader='$LOADER' fabric-api='$FAPI'"
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          { echo "LOOM=$LOOM"; echo "YARN=$YARN"; echo "LOADER=$LOADER"; echo "FAPI=$FAPI"; } >> "$GITHUB_ENV"

          # Полный отчёт запуска — всегда, на вкладку Summary. Без обратных кавычек в строках.
          {
            echo "## FLOWSTATE run report"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| loom strategy | $LOOM_STRATEGY |"
            echo "| **loom** | **$LOOM** |"
            echo "| reference (example-mod @$BRANCH) | mc=$REF_MC, loom=$LOOM_REF, gradle=${REF_GRADLE:-unknown} |"
            echo "| newest stable loom | $LOOM_NEWEST |"
            echo "| newest 1.10.x loom | ${LOOM_110:-none} |"
            echo "| **yarn** | **$YARN** |"
            echo "| loader | $LOADER |"
            echo "| **fabric-api** | **$FAPI** |"
            echo
            echo "<details><summary>Top-10 stable Loom releases</summary>"
            echo
            echo '```'
            printf '%s\n' "$LOOM_TOP10"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Pinned: loom=$LOOM | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI (strategy=$LOOM_STRATEGY)"

      - name: Build (compile + unit tests)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace --console=plain 2>&1 | tee build_log.txt

      - name: Failure digest
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if [ ! -f build_log.txt ]; then echo "::error::No build log captured"; exit 0; fi
          {
            echo "## Failure digest"
            echo
            echo "loom=$LOOM | fabric-api=$FAPI | strategy=$LOOM_STRATEGY | gradle=${REF_GRADLE:-8.14.2}"
            echo
            echo '```text'
            awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt
            echo
            grep 'Caused by:' build_log.txt | head -n 12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt || true
          grep 'Caused by:' build_log.txt | head -n 5 || true
          MIN_GRADLE="$(grep -o 'Minimum supported Gradle version is [0-9.]*' build_log.txt | head -n1 | grep -o '[0-9.]*$' || true)"
          [ -z "$MIN_GRADLE" ] || echo "::notice::Loom требует Gradle >= $MIN_GRADLE — версия уже берётся из эталона, проверьте шаг Detect reference Gradle version."
          if grep -q "Javadoc provided by mod" build_log.txt 2>/dev/null; then
            echo "::error::Javadoc remap failure again. Если strategy=reference — перезапустите с loom_strategy=loom_110 (гипотеза: в 1.10.x нет javadoc-процессора). Если strategy=loom_110 — попробуйте newest_release."
          fi

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
