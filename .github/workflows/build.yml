name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      fabric_api_pick:
        description: 'Fabric API build for 1.21.11: latest or previous'
        type: choice
        options: [ latest, previous ]
        default: latest
      loom_version:
        description: 'Loom: "latest" (auto-detect) or exact version, e.g. 1.10.5'
        type: string
        default: latest
      clean_cache:
        description: 'Wipe Gradle caches before build (fixes corrupted downloads)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Fabric 1.21.11, Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Clean Gradle caches (manual opt-in)
        if: inputs.clean_cache == true
        run: |
          echo "Wiping ~/.gradle/caches as requested"
          rm -rf ~/.gradle/caches

      - name: Read mod version
        run: |
          echo "ARTIFACT_VERSION=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')" >> "$GITHUB_ENV"

      - name: Resolve Loom version
        run: |
          set -euo pipefail
          REQ="${{ inputs.loom_version || 'latest' }}"
          if [ "$REQ" = "latest" ]; then
            LOOM=""
            META=$(curl -fsSL -A flowstate-ci https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml || true)
            if [ -n "$META" ]; then
              LOOM=$(printf '%s' "$META" | grep -o '<release>[^<]*</release>' | head -n1 | sed 's/<[^>]*>//g')
            fi
            # Подстраховка: <release> должен быть нормальной версией вида 1.12.3
            if ! printf '%s' "$LOOM" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
              echo "Falling back to full version list..."
              META=$(curl -fsSL -A flowstate-ci https://maven.fabricmc.net/fabric-loom/fabric-loom/maven-metadata.xml)
              LOOM=$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' \
                | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n1)
            fi
          else
            LOOM="$REQ"
          fi
          echo "Using Loom $LOOM"
          sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '$LOOM'/" build.gradle
          echo "LOOM=$LOOM" >> "$GITHUB_ENV"

      - name: Resolve & pin Fabric versions (strict 1.21.11)
        run: |
          set -euo pipefail
          REQUIRED_MC="1.21.11"
          UA="flowstate-ci (+https://github.com)"
          PICK="${{ inputs.fabric_api_pick || 'latest' }}"

          read_prop() {
            grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'
          }

          MC="$(read_prop minecraft_version)"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets $REQUIRED_MC strictly, gradle.properties has '$MC'"
            exit 1
          fi

          YARN_JSON="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/yarn)"
          YARN="$(printf '%s' "$YARN_JSON" | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
          if [ -z "$YARN" ]; then
            echo "::error::No Yarn mappings for $MC."
            exit 1
          fi

          LOADER_JSON="$(curl -fsSL -A "$UA" https://meta.fabricmc.net/v2/versions/loader)"
          LOADER="$(printf '%s' "$LOADER_JSON" | jq -r '[.[] | select(.stable == true)][0].version')"

          VERSIONS_JSON="$(curl -fsSL -A "$UA" \
            "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D")"
          if [ "$PICK" = "previous" ]; then
            FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[1].version_number // empty')"
            if [ -z "$FAPI" ]; then
              echo "::warning::Only one Fabric API build for $MC exists; using latest"
              FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[0].version_number // empty')"
            fi
          else
            FAPI="$(printf '%s' "$VERSIONS_JSON" | jq -r '.[0].version_number // empty')"
          fi
          if [ -z "$FAPI" ]; then
            echo "Modrinth lookup failed, trying maven.fabricmc.net..."
            FAPI="$(curl -fsSL -A "$UA" https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
              | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n1 || true)"
          fi
          if [ -z "$FAPI" ]; then
            echo "::error::No Fabric API build for $MC found."
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          {
            echo "YARN=$YARN"; echo "LOADER=$LOADER"; echo "FAPI=$FAPI"
          } >> "$GITHUB_ENV"
          echo "Pinned: loom=$LOOM | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI (pick=$PICK)"

      - name: Build (compile + unit tests)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee build_log.txt

      - name: Diagnose known failure modes
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if grep -q "Javadoc provided by mod" build_log.txt 2>/dev/null; then
            echo "::error::Loom javadoc remapping failure detected. Workarounds, in order:"
            echo "::error::1) Re-run with clean_cache=true"
            echo "::error::2) Re-run with fabric_api_pick=previous"
            echo "::error::3) Re-run with loom_version=<a 1.10.x release from https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml>"
            echo "::error::4) Search https://github.com/FabricMC/fabric-loom/issues for: Javadoc provided by mod must be have an intermediary source namespace"
          else
            echo "::error::Build failed for a different reason - open the Build step log"
          fi

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
