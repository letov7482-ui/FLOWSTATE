name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Loom: ${{ matrix.strategy }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: newest_release   # 1.18.4 — гипотеза: валидация исправлена
            gradle: '9.7.1'
          - strategy: loom_113         # новейший 1.13.x — средняя точка
            gradle: '9.7.1'
          - strategy: loom_112         # новейший 1.12.x — ближайшая к сломанной 1.11
            gradle: '8.14.2'
          - strategy: loom_110         # 1.10.5 — гипотеза: javadoc-процессора нет
            gradle: '8.14.2'
    env:
      LOOM_STRATEGY: ${{ matrix.strategy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Clean Gradle caches
        run: rm -rf ~/.gradle/caches

      - name: Read mod version
        run: |
          V="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')"
          [ -n "$V" ] || V="0.1.0"
          echo "ARTIFACT_VERSION=$V" >> "$GITHUB_ENV"

      - name: Prepare versions (loom / yarn / loader / fabric-api)
        run: |
          set -euo pipefail
          UA="flowstate-ci (+https://github.com)"
          REQUIRED_MC="1.21.11"
          fetch() { curl -fsSL -A "$UA" "$1" 2>/dev/null || true; }
          read_prop() { grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'; }

          MC="$(read_prop minecraft_version)"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets $REQUIRED_MC strictly, gradle.properties has '$MC'"
            exit 1
          fi

          META="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml)"
          LOOM_ALL="$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' || true)"
          stable() { printf '%s\n' "$1" | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 1; }
          LOOM_NEWEST="$(stable "$LOOM_ALL" || true)"
          LOOM_113="$(stable "$(printf '%s\n' "$LOOM_ALL" | grep -E '^1\.13\.')" || true)"
          LOOM_112="$(stable "$(printf '%s\n' "$LOOM_ALL" | grep -E '^1\.12\.')" || true)"
          LOOM_110="$(stable "$(printf '%s\n' "$LOOM_ALL" | grep -E '^1\.10\.')" || true)"

          case "$LOOM_STRATEGY" in
            newest_release) LOOM="$LOOM_NEWEST" ;;
            loom_113)       LOOM="$LOOM_113" ;;
            loom_112)       LOOM="$LOOM_112" ;;
            loom_110)       LOOM="$LOOM_110" ;;
            *) LOOM="" ;;
          esac
          if [ -z "$LOOM" ]; then
            echo "::error::Strategy '$LOOM_STRATEGY': no Loom version found on maven.fabricmc.net"
            exit 1
          fi
          sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '$LOOM'/" build.gradle

          # Yarn/Loader/Fabric API — сами, строго под 1.21.11 (эталон теперь под 26.3, он не источник)
          YARN="$(fetch https://meta.fabricmc.net/v2/versions/yarn \
            | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
          LOADER="$(fetch https://meta.fabricmc.net/v2/versions/loader \
            | jq -r '[.[] | select(.stable == true)][0].version')"
          VJ="$(fetch "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D")"
          FAPI="$(printf '%s' "$VJ" | jq -r '.[0].version_number // empty')"
          if [ -z "$FAPI" ]; then
            FAPI="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
              | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n1)"
          fi
          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$FAPI" ]; then
            echo "::error::Resolution failed: yarn='$YARN' loader='$LOADER' fabric-api='$FAPI'"
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          { echo "LOOM=$LOOM"; echo "YARN=$YARN"; echo "LOADER=$LOADER"; echo "FAPI=$FAPI"; } >> "$GITHUB_ENV"
          {
            echo "### Strategy: $LOOM_STRATEGY (gradle ${{ matrix.gradle }})"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| **loom** | **$LOOM** |"
            echo "| newest stable loom | ${LOOM_NEWEST:-none} |"
            echo "| newest 1.13.x | ${LOOM_113:-none} |"
            echo "| newest 1.12.x | ${LOOM_112:-none} |"
            echo "| newest 1.10.x | ${LOOM_110:-none} |"
            echo "| **yarn** | **$YARN** |"
            echo "| **loader** | **$LOADER** |"
            echo "| **fabric-api** | **$FAPI** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned: loom=$LOOM | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI"

      - name: Build (compile + unit tests)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace --console=plain 2>&1 | tee build_log.txt

      - name: Failure digest
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if [ ! -f build_log.txt ]; then echo "::error::No build log captured"; exit 0; fi
          {
            echo "### ❌ $LOOM_STRATEGY (loom=$LOOM, fabric-api=$FAPI)"
            echo
            echo '```text'
            awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt
            grep 'Caused by:' build_log.txt | head -n 6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          MIN_GRADLE="$(grep -o 'Minimum supported Gradle version is [0-9.]*' build_log.txt | head -n1 | grep -o '[0-9.]*$' || true)"
          [ -z "$MIN_GRADLE" ] || echo "::notice::$LOOM_STRATEGY требует Gradle >= $MIN_GRADLE (стоял ${{ matrix.gradle }})"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ matrix.strategy }}-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.strategy }}
          path: build_log.txt
          if-no-files-found: ignore
