name: Build FLOWSTATE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Loom: ${{ matrix.strategy }} (JDK ${{ matrix.java }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { strategy: loom_113,           java: '21', gradle: '9.7.1' }
          - { strategy: loom_114,           java: '21', gradle: '9.7.1' }
          - { strategy: loom_115,           java: '21', gradle: '9.7.1' }
          - { strategy: loom_116,           java: '21', gradle: '9.7.1' }
          - { strategy: loom_117,           java: '21', gradle: '9.7.1' }
          - { strategy: newest_release,     java: '25', gradle: '9.7.1' }
          - { strategy: loom11_oldest_fapi, java: '21', gradle: '8.14.2' }
    env:
      LOOM_STRATEGY: ${{ matrix.strategy }}
      JAVA_VER: ${{ matrix.java }}
      GRADLE_VER: ${{ matrix.gradle }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Clean Gradle caches
        run: rm -rf ~/.gradle/caches

      - name: Read mod version
        run: |
          V="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r')"
          [ -n "$V" ] || V="0.1.0"
          echo "ARTIFACT_VERSION=$V" >> "$GITHUB_ENV"

      - name: Prepare versions (loom / yarn / loader / fabric-api)
        run: |
          set -euo pipefail
          UA="flowstate-ci (+https://github.com)"
          REQUIRED_MC="1.21.11"
          fetch() { curl -fsSL -A "$UA" "$1" 2>/dev/null || true; }
          read_prop() { grep -m1 "^$1=" gradle.properties | cut -d= -f2- | sed 's/[[:space:]]*#.*$//' | tr -d '[:space:]\r'; }
          newest_of() { printf '%s\n' "$1" | grep -viE 'SNAPSHOT|alpha|beta|pre|rc' | sort -V | tail -n 1; }

          MC="$(read_prop minecraft_version)"
          if [ "$MC" != "$REQUIRED_MC" ]; then
            echo "::error::FLOWSTATE targets $REQUIRED_MC strictly, gradle.properties has '$MC'"
            exit 1
          fi

          META="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml)"
          LOOM_ALL="$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' || true)"
          LOOM_NEWEST="$(newest_of "$LOOM_ALL" || true)"

          LOOM=""
          OLDEST_FAPI="false"
          case "$LOOM_STRATEGY" in
            newest_release)     LOOM="$LOOM_NEWEST" ;;
            loom11_oldest_fapi) LOOM="1.11.8"; OLDEST_FAPI="true" ;;
            loom_1*)
              LINE="${LOOM_STRATEGY#loom_}"   # 113 -> 13
              LOOM="$(newest_of "$(printf '%s\n' "$LOOM_ALL" | grep -E "^1\.${LINE#1}\.")" || true)"
              ;;
          esac
          if [ -z "$LOOM" ]; then
            echo "::error::Strategy '$LOOM_STRATEGY': no Loom version found on maven"
            exit 1
          fi
          sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '$LOOM'/" build.gradle

          YARN="$(fetch https://meta.fabricmc.net/v2/versions/yarn \
            | jq -r --arg mc "$MC" '[.[] | select(.gameVersion == $mc)][0].version // empty')"
          LOADER="$(fetch https://meta.fabricmc.net/v2/versions/loader \
            | jq -r '[.[] | select(.stable == true)][0].version')"

          if [ "$OLDEST_FAPI" = "true" ]; then
            # Запасной сценарий: самая СТАРАЯ сборка Fabric API для 1.21.11 +
            # Loom 1.11.8 (единственный, дошедший до setup Minecraft без JDK-проблем)
            FAPI="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
              | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | head -n1)"
          else
            VJ="$(fetch "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${MC}%22%5D&loaders=%5B%22fabric%22%5D")"
            FAPI="$(printf '%s' "$VJ" | jq -r '.[0].version_number // empty')"
            if [ -z "$FAPI" ]; then
              FAPI="$(fetch https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | sort -V | tail -n1)"
            fi
          fi

          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$FAPI" ]; then
            echo "::error::Resolution failed: yarn='$YARN' loader='$LOADER' fabric-api='$FAPI'"
            exit 1
          fi

          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$FAPI/" gradle.properties

          { echo "LOOM=$LOOM"; echo "YARN=$YARN"; echo "LOADER=$LOADER"; echo "FAPI=$FAPI"; } >> "$GITHUB_ENV"
          {
            echo "### $LOOM_STRATEGY | loom=$LOOM | jdk=$JAVA_VER | gradle=$GRADLE_VER"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| **loom** | **$LOOM** |"
            echo "| newest stable loom | ${LOOM_NEWEST:-none} |"
            echo "| **yarn** | **$YARN** |"
            echo "| loader | $LOADER |"
            echo "| **fabric-api** | **$FAPI** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned: loom=$LOOM | yarn=$YARN | loader=$LOADER | fabric-api=$FAPI (strategy=$LOOM_STRATEGY)"

      - name: Build (compile + unit tests)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace --console=plain 2>&1 | tee build_log.txt

      - name: Failure digest
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if [ ! -f build_log.txt ]; then echo "::error::No build log captured"; exit 0; fi
          {
            echo "### ❌ $LOOM_STRATEGY (loom=$LOOM, fabric-api=$FAPI, jdk=$JAVA_VER)"
            echo
            echo '```text'
            awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' build_log.txt
            grep 'Caused by:' build_log.txt | head -n 6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          MIN_LOOM="$(grep -o 'newer version of Loom ([0-9.]*)' build_log.txt | head -n1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' || true)"
          [ -z "$MIN_LOOM" ] || echo "::notice::$LOOM_STRATEGY: Fabric API требует Loom >= $MIN_LOOM"
          JVM_REQ="$(grep -o 'requires at least JVM runtime version [0-9]*' build_log.txt | grep -o '[0-9]*$' || true)"
          [ -z "$JVM_REQ" ] || echo "::notice::$LOOM_STRATEGY: требуется JDK $JVM_REQ"

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ matrix.strategy }}-${{ env.ARTIFACT_VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.strategy }}
          path: build_log.txt
          if-no-files-found: ignore
