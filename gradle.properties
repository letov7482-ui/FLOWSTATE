org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ==== FLOWSTATE: строго Minecraft 1.21.11 ====
# ВАЖНО: в .properties НЕЛЬЗЯ писать комментарий после значения -
# он становится частью значения. Все комментарии - только с новой строки.
minecraft_version=1.21.11

# Значения ниже - резервные для локальной сборки.
# CI (build.yml) автоматически подставляет актуальные yarn/loader/fabric-api.
yarn_mappings=1.21.11+build.1
loader_version=0.17.2
fabric_version=0.135.0+1.21.11

mod_version=0.1.0
maven_group=dev.flowstate
archives_base_name=flowstate
